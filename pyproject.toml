[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-cost-of-learning-to-trade"
version = "1.0.0"
description = "Reproducible synthetic market-making research under hidden execution regimes"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Hugo Lemonnier"}]
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.12", "pandas>=2", "matplotlib>=3.8"]

[project.optional-dependencies]
report = ["reportlab>=4", "pypdf>=5", "pypandoc_binary>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]
